name: CI

on:
  push:
    branches: ["main", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Debug media formatting
        run: gofmt -d wa/media.go

      - name: Verify formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "gofmt required:"
            printf '%s\n' "$files"
            exit 1
          fi

      - name: Verify modules
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify

      - name: Test
        run: go test ./...

      - name: Test with FTS5
        run: go test -tags sqlite_fts5 ./...

      - name: Vet
        run: go vet -tags sqlite_fts5 ./...

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck -tags sqlite_fts5 ./...

      - name: Build
        run: CGO_ENABLED=1 go build -tags sqlite_fts5 -trimpath -ldflags="-s -w" -o /tmp/whatsappincli ./cmd/whatsappincli

      - name: Smoke test
        run: /tmp/whatsappincli version
